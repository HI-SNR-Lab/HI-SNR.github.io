{{- $title := .title | default "Click to expand" -}}
{{- $open := .open | default "false" -}}

<details class="research-accordion" {{ if eq $open "true" }}open{{ end }} style="margin: 1.5rem 0; border: 1px solid #ddd; border-radius: 6px; padding: 0.5rem 1rem; background: #fafafa;">
  <summary style="font-weight: 600; cursor: pointer; padding: 0.5rem 0; outline: none; font-size: 1.1rem; color: #1a1a1a;">
    {{ $title }}
  </summary>
  <div class="accordion-content" style="padding: 1rem 0 0.5rem 0; line-height: 1.6; border-top: 1px solid #eee; margin-top: 0.5rem;">
    {{ .content | safeHTML }}
  </div>
</details>
