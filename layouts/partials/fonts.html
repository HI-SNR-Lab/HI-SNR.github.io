<!-- Google Fonts -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Replace the family names below with the actual fonts specified in your theme.scss -->
<link href="https://googleapis.com/css2?family=Inter:wght@400;600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<!-- Font Awesome icons (Loads asynchronously exactly like your original script) -->
{{- $fontawesome := "https://use.fontawesome.com/releases/v6.5.0/css/all.css" -}}
<link
  href="{{ $fontawesome }}"
  rel="stylesheet"
  media="none"
  onload="this.removeAttribute('media'); this.onload = null;"
/>
<noscript>
  <link href="{{ $fontawesome }}" rel="stylesheet">
</noscript>
