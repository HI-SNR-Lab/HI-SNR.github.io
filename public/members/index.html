  </div>
</div>


<script>
var siteSearchInput = document.getElementById("site-search-input");
var siteSearchClearBtn = document.getElementById("site-search-clear-btn");
var siteSearchCounter = document.getElementById("site-search-counter-text");
var citationCards = document.querySelectorAll("#publications-target-list .citation-item-card");

function updateSearchInfo(query, count) {
  if (!siteSearchCounter) return;
  if (query === "") {
    siteSearchCounter.textContent = "Showing all " + citationCards.length + " items";
    if (siteSearchClearBtn) siteSearchClearBtn.disabled = true;
  } else {
    siteSearchCounter.textContent = "Found " + count + " matching results out of " + citationCards.length + " items";
    if (siteSearchClearBtn) siteSearchClearBtn.disabled = false;
  }
}


if (citationCards.length > 0) {
  updateSearchInfo("", citationCards.length);
}


function onSearchInput(inputElement) {
  var query = inputElement.value.toLowerCase().trim();
  var matchCount = 0;

  citationCards.forEach(function(card) {
    var pool = card.getAttribute("data-search-pool") || "";
    if (query === "" || pool.indexOf(query) !== -1) {
      card.style.display = "block";
      matchCount++;
    } else {
      card.style.display = "none";
    }
  });

  updateSearchInfo(query, matchCount);
}


function onSearchClear() {
  if (siteSearchInput) {
    siteSearchInput.value = "";
    onSearchInput(siteSearchInput);
    siteSearchInput.focus();
  }
}
</script>
